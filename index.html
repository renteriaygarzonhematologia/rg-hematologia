function driveGuardarClientId(){
  const id = gv('drive-client-id').trim();
  if(!id){ alert('Captura el Client ID'); return; }
  if(!id.includes('.apps.googleusercontent.com')){
    alert('El Client ID debe terminar en ".apps.googleusercontent.com". Verifica que lo copiaste completo.');
    return;
  }
  const cfg = driveLoadConfig();
  cfg.clientId = id;
  driveSaveConfig(cfg);
  toast('Client ID guardado. Ahora presiona "Conectar Google Drive"');
  renderSyncView();
}

function driveDesconectar(){
  driveAccessToken = null;
  driveFileId = null;
  driveFolderId = null;
  const cfg = driveLoadConfig();
  delete cfg.userEmail;
  driveSaveConfig(cfg);
  toast('Desconectado de Google Drive');
  renderSyncView();
}

// Inicializa el flujo OAuth cuando el usuario presiona "Conectar"
function driveConectar(){
  const cfg = driveLoadConfig();
  if(!cfg.clientId){
    alert('Primero captura tu Client ID de Google');
    return;
  }
  if(typeof google === 'undefined' || !google.accounts?.oauth2){
    alert('La librería de Google aún se está cargando. Espera 2-3 segundos e intenta de nuevo.');
    return;
  }

  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cfg.clientId,
    scope: DRIVE_SCOPE,
    callback: async (resp)=>{
      if(resp.error){
        alert('Error al autenticar: '+resp.error+'\n\n'+(resp.error_description||''));
        return;
      }
      driveAccessToken = resp.access_token;

      // Obtener email del usuario para mostrarlo
      try{
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: {'Authorization':'Bearer '+driveAccessToken}
        });
        const u = await r.json();
        const cfg2 = driveLoadConfig();
        cfg2.userEmail = u.email||'';
        driveSaveConfig(cfg2);
      }catch(e){console.error(e);}

      toast('✓ Conectado a Google Drive');
      renderSyncView();
    }
  });
  driveTokenClient.requestAccessToken({prompt:'consent'});
}

// Encuentra o crea la carpeta RG_Hematologia en Drive
async function driveGetOrCreateFolder(){
  if(driveFolderId) return driveFolderId;

  // Buscar la carpeta
  const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("name='"+DRIVE_FOLDER_NAME+"' and mimeType='application/vnd.google-apps.folder' and trashed=false")}&fields=files(id,name)`, {
    headers:{'Authorization':'Bearer '+driveAccessToken}
  });
  const sj = await search.json();
  if(sj.files && sj.files.length){
    driveFolderId = sj.files[0].id;
    return driveFolderId;
  }
  // Crear
  const create = await fetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST',
    headers:{'Authorization':'Bearer '+driveAccessToken,'Content-Type':'application/json'},
    body: JSON.stringify({name:DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder'})
  });
  const cj = await create.json();
  driveFolderId = cj.id;
  return driveFolderId;
}

// Encuentra el archivo de respaldo dentro de la carpeta (si existe)
async function driveFindBackupFile(folderId){
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("name='"+DRIVE_FILE_NAME+"' and '"+folderId+"' in parents and trashed=false")}&fields=files(id,name,modifiedTime,size)`, {
    headers:{'Authorization':'Bearer '+driveAccessToken}
  });
  const j = await r.json();
  return j.files && j.files.length ? j.files[0] : null;
}

// Empaqueta toda la base local (db + archivos binarios IndexedDB) en un solo JSON
async function drivePrepararPaquete(){
  const archivos = [];
  try{
    const all = await idbListFiles({});
    for(const f of all){
      // Convertir Blob a base64
      const blob = f.blob;
      if(blob){
        const b64 = await blobABase64(blob);
        archivos.push({
          id: f.id,
          name: f.name,
          type: f.type,
          size: f.size,
          patientId: f.patientId,
          patientName: f.patientName,
          module: f.module,
          consentTipo: f.consentTipo,
          extractedText: f.extractedText,
          created: f.created,
          dataB64: b64
        });
      }
    }
  }catch(e){console.error('Error empaquetando archivos:',e);}

  return {
    version: '1.0',
    timestamp: new Date().toISOString(),
    db: db,
    archivos: archivos
  };
}

function blobABase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result.split(',')[1]); // quitar el prefijo data:...;base64,
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function base64ABlob(b64, mimeType){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mimeType||'application/octet-stream'});
}

// SUBIR a Drive
async function driveSubir(){
  if(!driveAccessToken){ toast('No conectado a Drive'); return; }

  // Confirmación con resumen del paquete que se va a subir
  const totalPts = db.patients.length;
  const totalDocs = db.documents.length;
  const totalCons = (db.consentimientos||[]).length;
  let totalArchivos = 0;
  try{ totalArchivos = (await idbListFiles({})).length; }catch(e){}

  // Última sincronización
  const cfg = driveLoadConfig();
  const lastSync = cfg.lastSync ? new Date(cfg.lastSync).toLocaleString('es-MX') : 'Nunca';
  const lastAction = cfg.lastAction === 'upload' ? 'subida' : (cfg.lastAction === 'download' ? 'bajada' : '—');

  let confirmacion = `¿Subir los datos actuales a Google Drive?\n\n`;
  confirmacion += `═══════════════════════════════\n`;
  confirmacion += `RESUMEN DEL RESPALDO A SUBIR:\n`;
  confirmacion += `═══════════════════════════════\n\n`;
  confirmacion += `• ${totalPts} paciente${totalPts!==1?'s':''}\n`;
  confirmacion += `• ${totalDocs} documento${totalDocs!==1?'s':''} clínico${totalDocs!==1?'s':''}\n`;
  confirmacion += `• ${totalCons} consentimiento${totalCons!==1?'s':''}\n`;
  confirmacion += `• ${totalArchivos} archivo${totalArchivos!==1?'s':''} binario${totalArchivos!==1?'s':''} (PDFs, imágenes)\n\n`;
  confirmacion += `Última sincronización: ${lastSync} (${lastAction})\n\n`;
  confirmacion += `⚠ Esta acción SOBRESCRIBE el respaldo anterior en Drive.\n\n`;
  confirmacion += `Asegúrate de que estos son los datos más recientes. Si trabajaste en otro dispositivo después de la última sincronización, primero deberías "⬇ Bajar de Drive" en este dispositivo o subir desde el dispositivo más actualizado.`;

  if(!confirm(confirmacion)) return;

  const el = document.getElementById('drive-result');
  el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Empaquetando datos...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

  try{
    const folderId = await driveGetOrCreateFolder();
    const paquete = await drivePrepararPaquete();
    const json = JSON.stringify(paquete);
    const sizeMB = (json.length/1048576).toFixed(2);

    el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Subiendo ${sizeMB} MB a Google Drive...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

    const existing = await driveFindBackupFile(folderId);
    const blob = new Blob([json], {type:'application/json'});

    let endpoint, method;
    if(existing){
      endpoint = `https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`;
      method = 'PATCH';
    } else {
      // Subida con multipart para incluir metadata (nombre + carpeta)
      endpoint = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
      method = 'POST';
    }

    let body, headers;
    if(existing){
      headers = {'Authorization':'Bearer '+driveAccessToken,'Content-Type':'application/json'};
      body = json;
    } else {
      const boundary = '-------rg-boundary-'+Date.now();
      const metadata = {name:DRIVE_FILE_NAME, parents:[folderId]};
      const multipartBody =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n` +
        `--${boundary}--`;
      headers = {'Authorization':'Bearer '+driveAccessToken,'Content-Type':'multipart/related; boundary='+boundary};
      body = multipartBody;
    }

    const resp = await fetch(endpoint, {method, headers, body});
    if(!resp.ok){
      const err = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${err.slice(0,200)}`);
    }
    const result = await resp.json();
    driveFileId = result.id;

    const cfg = driveLoadConfig();
    cfg.lastSync = new Date().toISOString();
    cfg.lastAction = 'upload';
    driveSaveConfig(cfg);

    el.innerHTML = `<div class="ai-panel" style="background:var(--gr50);border-color:var(--gr200);">
      <div class="ai-hdr"><div class="ai-dot" style="background:var(--gr600);"></div><span class="ai-ttl" style="color:var(--gr800);">✓ Subida completada</span></div>
      <div class="ai-body" style="color:var(--gr800);">
        <strong>Archivo:</strong> ${DRIVE_FILE_NAME}<br>
        <strong>Tamaño:</strong> ${sizeMB} MB<br>
        <strong>Pacientes:</strong> ${db.patients.length}<br>
        <strong>Documentos:</strong> ${db.documents.length}<br>
        <strong>Consentimientos:</strong> ${(db.consentimientos||[]).length}<br>
        <strong>Archivos binarios:</strong> ${paquete.archivos.length}
      </div>
    </div>`;
    toast('✓ Datos subidos a Google Drive');
    setTimeout(renderSyncView, 1500);
  }catch(e){
    el.innerHTML = `<div class="ai-panel" style="background:var(--r50);border-color:#F09595;"><div class="ai-body" style="color:var(--r800);"><strong>Error al subir:</strong> ${e.message}</div></div>`;
  }
}

// BAJAR de Drive
async function driveBajar(){
  if(!driveAccessToken){ toast('No conectado a Drive'); return; }

  // Primero busca el archivo en Drive para mostrar info en la confirmación
  const el = document.getElementById('drive-result');
  el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Buscando archivo en Drive...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

  let folderId, file;
  try{
    folderId = await driveGetOrCreateFolder();
    file = await driveFindBackupFile(folderId);
  }catch(e){
    el.innerHTML = `<div class="ai-panel" style="background:var(--r50);border-color:#F09595;"><div class="ai-body" style="color:var(--r800);"><strong>Error al buscar en Drive:</strong> ${e.message}</div></div>`;
    return;
  }

  if(!file){
    el.innerHTML = `<div class="ai-panel" style="background:var(--a50);border-color:#EF9F27;"><div class="ai-body" style="color:var(--a800);"><strong>No se encontró respaldo en Drive.</strong><br>Sube primero los datos desde otro dispositivo, o usa "⬆ Subir a Drive" desde aquí para crear el primer respaldo.</div></div>`;
    return;
  }

  // Datos locales actuales
  const totalPtsLocal = db.patients.length;
  const totalDocsLocal = db.documents.length;
  const totalConsLocal = (db.consentimientos||[]).length;
  let totalArchivosLocal = 0;
  try{ totalArchivosLocal = (await idbListFiles({})).length; }catch(e){}

  // Info del archivo en Drive
  const sizeMB = file.size ? (parseInt(file.size)/1048576).toFixed(2) : '?';
  const modifiedDate = file.modifiedTime ? new Date(file.modifiedTime).toLocaleString('es-MX') : 'Desconocida';
  const cfg = driveLoadConfig();
  const lastSyncStr = cfg.lastSync ? new Date(cfg.lastSync).toLocaleString('es-MX') : 'Nunca';
  const lastAction = cfg.lastAction === 'upload' ? 'subida' : (cfg.lastAction === 'download' ? 'bajada' : '—');

  // Confirmación con detalles
  let confirmacion = `¿Bajar el respaldo de Google Drive a este dispositivo?\n\n`;
  confirmacion += `═══════════════════════════════\n`;
  confirmacion += `ARCHIVO EN DRIVE:\n`;
  confirmacion += `═══════════════════════════════\n`;
  confirmacion += `• Tamaño: ${sizeMB} MB\n`;
  confirmacion += `• Última modificación en Drive: ${modifiedDate}\n\n`;
  confirmacion += `═══════════════════════════════\n`;
  confirmacion += `DATOS LOCALES ACTUALES (se reemplazan):\n`;
  confirmacion += `═══════════════════════════════\n`;
  confirmacion += `• ${totalPtsLocal} paciente${totalPtsLocal!==1?'s':''}\n`;
  confirmacion += `• ${totalDocsLocal} documento${totalDocsLocal!==1?'s':''} clínico${totalDocsLocal!==1?'s':''}\n`;
  confirmacion += `• ${totalConsLocal} consentimiento${totalConsLocal!==1?'s':''}\n`;
  confirmacion += `• ${totalArchivosLocal} archivo${totalArchivosLocal!==1?'s':''} binario${totalArchivosLocal!==1?'s':''}\n\n`;
  confirmacion += `Última sincronización en este dispositivo: ${lastSyncStr} (${lastAction})\n\n`;
  confirmacion += `⚠ Al bajar, TODOS los datos locales serán reemplazados por los de Drive.\n\n`;
  confirmacion += `Si tienes cambios sin sincronizar, cancela y primero sube los datos.`;

  if(!confirm(confirmacion)){
    el.innerHTML = '';
    return;
  }

  el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Descargando ${sizeMB} MB...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

  try{
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
      headers:{'Authorization':'Bearer '+driveAccessToken}
    });
    if(!r.ok) throw new Error('No se pudo descargar el archivo');
    const paquete = await r.json();

    if(!paquete.db || !paquete.version){
      throw new Error('El archivo no tiene el formato esperado');
    }

    // Reemplazar localStorage
    db = paquete.db;
    saveDB();

    // Limpiar IndexedDB y restaurar archivos binarios
    el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Restaurando archivos binarios...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

    // Limpiar IDB existente
    const existentes = await idbListFiles({});
    for(const f of existentes){
      try{ await idbDeleteFile(f.id); }catch(e){}
    }

    // Restaurar archivos del paquete
    let restaurados = 0;
    if(paquete.archivos && paquete.archivos.length){
      const dbConn = await idbOpen();
      for(const a of paquete.archivos){
        try{
          const blob = base64ABlob(a.dataB64, a.type);
          const record = {
            id: a.id,
            name: a.name,
            type: a.type,
            size: a.size,
            blob: blob,
            patientId: a.patientId,
            patientName: a.patientName,
            module: a.module,
            consentTipo: a.consentTipo,
            extractedText: a.extractedText,
            created: a.created
          };
          await new Promise((resolve, reject)=>{
            const tx = dbConn.transaction([IDB_STORE],'readwrite');
            const req = tx.objectStore(IDB_STORE).put(record);
            req.onsuccess = ()=>resolve();
            req.onerror = ()=>reject(req.error);
          });
          restaurados++;
        }catch(e){console.error('Error restaurando archivo:',e);}
      }
    }

    const cfg = driveLoadConfig();
    cfg.lastSync = new Date().toISOString();
    cfg.lastAction = 'download';
    driveSaveConfig(cfg);

    // Resetear paciente actual si ya no existe
    if(currentPatient && !db.patients.find(p=>p.id===currentPatient.id)){
      currentPatient = null;
    }

    el.innerHTML = `<div class="ai-panel" style="background:var(--gr50);border-color:var(--gr200);">
      <div class="ai-hdr"><div class="ai-dot" style="background:var(--gr600);"></div><span class="ai-ttl" style="color:var(--gr800);">✓ Datos restaurados desde Drive</span></div>
      <div class="ai-body" style="color:var(--gr800);">
        <strong>Pacientes restaurados:</strong> ${db.patients.length}<br>
        <strong>Documentos:</strong> ${db.documents.length}<br>
        <strong>Consentimientos:</strong> ${(db.consentimientos||[]).length}<br>
        <strong>Archivos binarios:</strong> ${restaurados}<br>
        <strong>Fecha del respaldo:</strong> ${new Date(paquete.timestamp).toLocaleString('es-MX')}
      </div>
    </div>`;
    toast('✓ Datos restaurados desde Google Drive');
    setTimeout(renderSyncView, 2000);
  }catch(e){
    el.innerHTML = `<div class="ai-panel" style="background:var(--r50);border-color:#F09595;"><div class="ai-body" style="color:var(--r800);"><strong>Error al bajar:</strong> ${e.message}</div></div>`;
  }
}
