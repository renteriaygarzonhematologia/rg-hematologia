<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Hematología — Expediente Electrónico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --rg-purple:#4A2961;--rg-purple-dark:#2A1538;--rg-purple-mid:#5E3478;--rg-purple-light:#7B4A98;--rg-purple-soft:#9D6FB8;
  --rg-pink:#993556;--rg-pink-dark:#72243E;--rg-pink-light:#D4537E;
  --p50:#F5F0F8;--p100:#E8DCEF;--p200:#D4BCE0;--p300:#B89BCF;
  --pk50:#FBEAF0;--pk100:#F4C0D1;--pk200:#ED93B1;
  --rg-cream:#FAF7FB;--rg-card:#FFFFFF;
  --gr50:#EAF3DE;--gr200:#97C459;--gr600:#3B6D11;--gr800:#27500A;
  --a50:#FAEEDA;--a200:#EF9F27;--a800:#633806;
  --b50:#E6F1FB;--b200:#85B7EB;--b600:#185FA5;--b800:#0C447C;
  --r50:#FCEBEB;--r600:#A32D2D;--r800:#791F1F;
  --t50:#E1F5EE;--t100:#9FE1CB;--t200:#5DCAA5;--t600:#0F6E56;--t800:#085041;
}
body{font-family:'Helvetica Neue',Arial,sans-serif;color:var(--rg-purple-dark);background:var(--rg-cream);min-height:100vh;}

.app{display:flex;min-height:100vh;}
.sidebar{width:235px;background:var(--rg-card);border-right:1px solid var(--p100);display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:sticky;top:0;overflow-y:auto;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.header{background:var(--rg-card);border-bottom:1px solid var(--p100);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.content{flex:1;padding:22px;overflow-y:auto;}

.logo-block{padding:18px 14px 14px;text-align:center;background:linear-gradient(180deg,#fff 0%,var(--p50) 100%);border-bottom:1px solid var(--p100);}
.logo-img{width:100%;max-width:175px;height:auto;display:block;margin:0 auto;}

.nav-section{padding:10px 0;border-bottom:1px solid var(--p100);}
.nav-label{font-size:10px;font-weight:600;color:var(--rg-purple-soft);padding:0 18px 6px;text-transform:uppercase;letter-spacing:0.1em;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:13px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;color:var(--rg-purple-dark);transition:all 0.15s;font-family:inherit;}
.nav-item:hover{background:var(--p50);color:var(--rg-purple);}
.nav-item.active{background:linear-gradient(90deg,var(--p50) 0%,transparent 100%);color:var(--rg-purple);font-weight:500;border-left:3px solid var(--rg-pink);padding-left:15px;}
.nav-icon{font-size:14px;width:18px;text-align:center;}

.tagline{padding:14px 16px;font-size:9.5px;color:var(--rg-purple-soft);text-align:center;border-top:1px solid var(--p100);margin-top:auto;letter-spacing:0.08em;line-height:1.5;}

.header-left h2{font-family:Georgia,serif;font-size:20px;font-weight:500;color:var(--rg-purple);}
.header-left p{font-size:11.5px;color:var(--rg-purple-soft);margin-top:2px;}
.header-actions{display:flex;gap:8px;align-items:center;}

.btn{padding:7px 16px;border-radius:6px;border:1px solid var(--p200);background:transparent;cursor:pointer;font-size:12.5px;color:var(--rg-purple-dark);transition:all 0.15s;font-family:inherit;}
.btn:hover{background:var(--p50);border-color:var(--rg-purple-light);}
.btn-primary{background:var(--rg-purple);color:#fff;border-color:var(--rg-purple);}
.btn-primary:hover{background:var(--rg-purple-dark);}
.btn-pink{background:var(--rg-pink);color:#fff;border-color:var(--rg-pink);}
.btn-pink:hover{background:var(--rg-pink-dark);}
.btn-ai{background:var(--t50);color:var(--t600);border-color:var(--t200);}
.btn-ai:hover{background:var(--t100);}
.btn-sm{padding:5px 11px;font-size:11.5px;}

.welcome-card{background:linear-gradient(135deg,var(--rg-purple) 0%,var(--rg-pink) 100%);color:#fff;border-radius:14px;padding:24px 26px;margin-bottom:18px;position:relative;overflow:hidden;}
.welcome-card::after{content:'';position:absolute;top:-30px;right:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,0.12) 0%,transparent 70%);border-radius:50%;}
.welcome-card h1{font-family:Georgia,serif;font-size:22px;font-weight:500;margin-bottom:6px;}
.welcome-card .accent{width:50px;height:2px;background:#fff;margin:10px 0;opacity:0.7;}
.welcome-card p{font-size:13px;opacity:0.93;line-height:1.55;}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat-card{background:var(--rg-card);border:1px solid var(--p100);border-radius:10px;padding:14px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rg-purple),var(--rg-pink));}
.stat-label{font-size:10.5px;color:var(--rg-purple-soft);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
.stat-value{font-family:Georgia,serif;font-size:26px;font-weight:500;color:var(--rg-purple);}
.stat-sub{font-size:11px;color:var(--rg-purple-soft);margin-top:2px;}

.card{background:var(--rg-card);border:1px solid var(--p100);border-radius:10px;padding:18px;margin-bottom:14px;}
.card-title{font-size:11px;font-weight:600;color:var(--rg-purple-soft);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.1em;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

.patient-list{display:flex;flex-direction:column;gap:8px;}
.patient-row{display:flex;align-items:center;gap:11px;padding:10px;background:var(--p50);border-radius:8px;cursor:pointer;border-left:3px solid transparent;transition:all 0.15s;}
.patient-row:hover{border-left-color:var(--rg-pink);background:var(--rg-cream);}
.patient-row.selected{border-left-color:var(--rg-pink);background:var(--pk50);}
.patient-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--rg-purple-soft) 0%,var(--rg-pink-light) 100%);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:500;font-size:13px;color:#fff;flex-shrink:0;}
.patient-info-l{flex:1;min-width:0;}
.patient-name{font-family:Georgia,serif;font-size:13.5px;font-weight:500;color:var(--rg-purple);}
.patient-meta{font-size:11px;color:var(--rg-purple-soft);margin-top:1px;}
.patient-tag{display:inline-block;font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:20px;background:var(--pk50);color:var(--rg-pink-dark);}

.activity-list{display:flex;flex-direction:column;gap:8px;}
.activity-item{display:flex;align-items:flex-start;gap:11px;padding:10px;border-radius:8px;background:var(--p50);}
.activity-dot{width:7px;height:7px;border-radius:50%;background:var(--rg-pink);margin-top:6px;flex-shrink:0;}
.activity-content{flex:1;}
.activity-title{font-family:Georgia,serif;font-size:13px;color:var(--rg-purple);font-weight:500;}
.activity-meta{font-size:11px;color:var(--rg-purple-soft);margin-top:2px;}

.brand-divider{height:2px;background:linear-gradient(90deg,transparent,var(--rg-pink),var(--rg-purple),transparent);margin:18px 0;border-radius:2px;}

.ai-banner{background:linear-gradient(135deg,var(--p50) 0%,var(--pk50) 100%);border:1px solid var(--p200);border-radius:10px;padding:16px;display:flex;align-items:center;gap:14px;}
.ai-icon{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--rg-purple) 0%,var(--rg-pink) 100%);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;}
.ai-text h4{font-family:Georgia,serif;font-size:14px;font-weight:500;color:var(--rg-purple);margin-bottom:3px;}
.ai-text p{font-size:11.5px;color:var(--rg-purple-mid);line-height:1.5;}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title{font-family:Georgia,serif;font-size:18px;font-weight:500;color:var(--rg-purple);}

.view-content{display:none;}
.view-content.active{display:block;}

.empty-state{text-align:center;padding:36px 20px;color:var(--rg-purple-soft);font-size:13px;}
.empty-icon{font-size:32px;margin-bottom:10px;opacity:0.5;}

/* Forms */
.fg{display:flex;flex-direction:column;gap:4px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.g1{display:grid;grid-template-columns:1fr;gap:10px;}
.full{grid-column:1/-1;}
label{font-size:11px;color:var(--rg-purple-soft);font-weight:500;letter-spacing:0.02em;}
input,select,textarea{border:1px solid var(--p200);border-radius:6px;padding:7px 10px;font-size:13px;background:#fff;color:var(--rg-purple-dark);font-family:inherit;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rg-purple);}
textarea{resize:vertical;line-height:1.5;min-height:72px;}
input[readonly]{background:var(--p50);color:var(--rg-purple-soft);}

/* Sections */
.sw{background:var(--rg-card);border:1px solid var(--p100);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;}
.sh:hover{background:var(--p50);}
.st{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;color:var(--rg-purple);}
.ch{font-size:10px;color:var(--rg-purple-soft);transition:transform 0.2s;display:inline-block;}
.ch.open{transform:rotate(90deg);}
.badge{font-size:11px;font-weight:500;padding:2px 10px;border-radius:20px;}
.b-purple{background:var(--p50);color:var(--rg-purple);}
.b-pink{background:var(--pk50);color:var(--rg-pink-dark);}
.sbody{padding:16px;display:none;border-top:1px solid var(--p100);}
.sbody.open{display:block;}

.ss{margin-top:14px;padding-top:14px;border-top:1px solid var(--p100);}
.ss:first-child{margin-top:0;padding-top:0;border-top:none;}
.ss-grid-2col > .ss{margin-top:0 !important;padding-top:0 !important;border-top:none !important;}
.ss-title{font-size:11px;font-weight:500;color:var(--rg-purple-soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.05em;}

.rr{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.rr label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--rg-purple-dark);cursor:pointer;font-weight:400;letter-spacing:0;}
.rr input[type=radio]{width:auto;}

.hbtn-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.hb{padding:5px 12px;border:1px solid var(--p200);border-radius:20px;font-size:12px;cursor:pointer;background:transparent;color:var(--rg-purple-soft);transition:all 0.15s;font-family:inherit;}
.hb:hover{background:var(--p50);}
.hb.sel-no{background:var(--gr50);color:var(--gr800);border-color:var(--gr200);}
.hb.sel-ex{background:var(--a50);color:var(--a800);border-color:var(--a200);}
.hb.sel-si{background:var(--pk50);color:var(--rg-pink-dark);border-color:var(--pk200);}

/* Patient bar */
.pt-bar{background:linear-gradient(135deg,var(--p50) 0%,var(--pk50) 100%);border:1px solid var(--p100);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.pt-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--rg-purple) 0%,var(--rg-pink) 100%);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:500;font-size:15px;color:#fff;flex-shrink:0;}
.pt-name{font-family:Georgia,serif;font-size:15px;font-weight:500;color:var(--rg-purple);}
.pt-sub{font-size:12px;color:var(--rg-purple-soft);margin-top:1px;}

.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}

.save-bar{display:flex;gap:8px;padding:14px 0 4px;flex-wrap:wrap;}
.note{font-size:11px;color:var(--rg-purple-soft);margin-top:6px;}
.hint{font-size:11px;color:var(--rg-purple-soft);line-height:1.5;margin-top:4px;}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(42,21,56,0.5);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
.modal{background:#fff;border-radius:14px;padding:24px;width:580px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(74,41,97,0.2);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--p100);}
.modal-title{font-family:Georgia,serif;font-size:18px;font-weight:500;color:var(--rg-purple);}
.modal-close{background:none;border:none;cursor:pointer;font-size:22px;color:var(--rg-purple-soft);padding:4px 8px;border-radius:4px;}
.modal-close:hover{background:var(--p50);color:var(--rg-purple);}

/* AI panel */
.ai-panel{background:linear-gradient(135deg,var(--p50) 0%,var(--pk50) 100%);border:1px solid var(--p200);border-radius:10px;padding:14px;margin-top:14px;}
.ai-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--rg-pink);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.ai-ttl{font-size:13px;font-weight:500;color:var(--rg-purple);}
.ai-body{font-size:13px;color:var(--rg-purple-mid);line-height:1.6;}
.ai-ldr{display:flex;gap:4px;}
.ai-d{width:6px;height:6px;border-radius:50%;background:var(--rg-pink);animation:bounce 1.2s infinite;}
.ai-d:nth-child(2){animation-delay:.2s}.ai-d:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

/* Vitals */
.sv-card{background:var(--p50);border-radius:10px;padding:14px;margin-bottom:14px;}
.sv-label{font-size:10.5px;font-weight:600;color:var(--rg-purple-soft);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;}
.alert-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.alert-chip{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;display:inline-block;}
.chip-warn{background:var(--a50);color:var(--a800);}
.chip-alert{background:var(--r50);color:var(--r800);}
.chip-ok{background:var(--gr50);color:var(--gr800);}

/* Upload zone */
.upload-zone{border:2px dashed var(--p200);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all 0.15s;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--rg-pink);background:var(--pk50);}
.upload-icon{font-size:24px;margin-bottom:8px;}

/* Doc cards */
.doc-card{background:var(--rg-card);border:1px solid var(--p100);border-radius:8px;padding:12px;display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;}
.doc-icon-sm{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--p100) 0%,var(--pk50) 100%);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.doc-info{flex:1;min-width:0;}
.doc-name{font-size:13px;font-weight:500;color:var(--rg-purple);}
.doc-meta-sm{font-size:11px;color:var(--rg-purple-soft);margin-top:2px;}
.doc-prev-sm{font-size:12px;color:var(--rg-purple-mid);margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.doc-actions-sm{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}

/* Module cards (documentos view) */
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.module-card{background:var(--rg-card);border:1px solid var(--p100);border-radius:10px;padding:18px;cursor:pointer;transition:all 0.2s;text-align:left;font-family:inherit;}
.module-card:hover{border-color:var(--rg-pink);transform:translateY(-2px);box-shadow:0 4px 14px rgba(153,53,86,0.13);}
.module-icon-wrap{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--p100) 0%,var(--pk50) 100%);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px;}
.module-title{font-family:Georgia,serif;font-size:15px;font-weight:500;color:var(--rg-purple);margin-bottom:4px;}
.module-desc{font-size:12px;color:var(--rg-purple-soft);line-height:1.5;}

/* Tabs */
.subtabs{display:flex;border-bottom:1px solid var(--p100);margin-bottom:18px;}
.subtab{padding:10px 18px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--rg-purple-soft);background:transparent;border-top:none;border-left:none;border-right:none;font-family:inherit;}
.subtab:hover{color:var(--rg-purple);}
.subtab.active{color:var(--rg-purple);border-bottom-color:var(--rg-pink);font-weight:500;}

.warn-card{background:var(--a50);border:1px solid var(--a200);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--a800);}

/* Tags estado */
.consent-tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;}
.tag-signed{background:var(--gr50);color:var(--gr800);}
.tag-tutor{background:var(--b50);color:var(--b800);}
.tag-pending{background:var(--a50);color:var(--a800);}
.tag-na{background:var(--p100);color:var(--rg-purple-mid);}

@media(max-width:780px){
  .sidebar{display:none;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .two-col{grid-template-columns:1fr;}
  .g2,.g3,.g4{grid-template-columns:1fr;}
  .ss-grid-2col{grid-template-columns:1fr !important;}
}
</style>
</head>
<body>

<div class="app">

<script>
// ============= INDEXEDDB PARA ARCHIVOS BINARIOS =============
// Capa simple para guardar archivos (JPG, PNG, PDF) con sus metadatos.
// Capacidad: cientos de MB a varios GB según el navegador.
const IDB_NAME = 'rg_hematologia_files';
const IDB_VERSION = 1;
const IDB_STORE = 'archivos';

let _idbConn = null;

function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(_idbConn){ resolve(_idbConn); return; }
    if(!('indexedDB' in window)){ reject(new Error('Tu navegador no soporta IndexedDB')); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onerror = ()=>reject(req.error);
    req.onupgradeneeded = (e)=>{
      const dbConn = e.target.result;
      if(!dbConn.objectStoreNames.contains(IDB_STORE)){
        const store = dbConn.createObjectStore(IDB_STORE, {keyPath:'id'});
        store.createIndex('patientId','patientId',{unique:false});
        store.createIndex('module','module',{unique:false});
        store.createIndex('created','created',{unique:false});
      }
    };
    req.onsuccess = ()=>{ _idbConn = req.result; resolve(_idbConn); };
  });
}

// Guarda un File (de un input) en IndexedDB. Devuelve el id generado.
async function idbSaveFile(file, metadata={}){
  const dbConn = await idbOpen();
  const id = 'F'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  const record = {
    id,
    name: file.name,
    type: file.type,
    size: file.size,
    blob: file, // IndexedDB acepta Blobs/Files directamente
    created: new Date().toISOString(),
    ...metadata
  };
  return new Promise((resolve, reject)=>{
    const tx = dbConn.transaction([IDB_STORE],'readwrite');
    const store = tx.objectStore(IDB_STORE);
    const req = store.add(record);
    req.onsuccess = ()=>resolve(id);
    req.onerror = ()=>reject(req.error);
  });
}

// Recupera un archivo por id.
async function idbGetFile(id){
  const dbConn = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = dbConn.transaction([IDB_STORE],'readonly');
    const req = tx.objectStore(IDB_STORE).get(id);
    req.onsuccess = ()=>resolve(req.result||null);
    req.onerror = ()=>reject(req.error);
  });
}

// Lista archivos por paciente y/o módulo.
async function idbListFiles(filters={}){
  const dbConn = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = dbConn.transaction([IDB_STORE],'readonly');
    const req = tx.objectStore(IDB_STORE).getAll();
    req.onsuccess = ()=>{
      let all = req.result||[];
      if(filters.patientId) all = all.filter(f=>f.patientId===filters.patientId);
      if(filters.module) all = all.filter(f=>f.module===filters.module);
      all.sort((a,b)=>(b.created||'').localeCompare(a.created||''));
      resolve(all);
    };
    req.onerror = ()=>reject(req.error);
  });
}

// Borra un archivo por id.
async function idbDeleteFile(id){
  const dbConn = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = dbConn.transaction([IDB_STORE],'readwrite');
    const req = tx.objectStore(IDB_STORE).delete(id);
    req.onsuccess = ()=>resolve(true);
    req.onerror = ()=>reject(req.error);
  });
}

// Genera una URL de objeto temporal para mostrar/descargar el archivo en el navegador.
function idbObjectURL(record){
  if(!record || !record.blob) return null;
  return URL.createObjectURL(record.blob);
}

// Estima el espacio usado por IndexedDB (si el navegador lo soporta).
async function idbEstimate(){
  if('storage' in navigator && 'estimate' in navigator.storage){
    const est = await navigator.storage.estimate();
    return {usage: est.usage||0, quota: est.quota||0};
  }
  return null;
}

// Recoge los datos del formulario para imprimir
function recopilarDatosImpresion(tipo){
  const prefixes = {historia:'hc-', evolucion:'ev-', resumen:'res-', referencia:'ref-', receta:'rx-'};
  const prefix = prefixes[tipo];
  if(!prefix) return {};

  // Para cada módulo, listamos los campos relevantes
  const sections = PRINT_SECTIONS[tipo] || [];
  const data = {};

  // Recolecta los keys de una sección, manejando subsecciones
  const recogerKeys = (keys)=>{
    keys.forEach(k=>{
      const el = document.getElementById(prefix+k);
      if(el){
        if(el.tagName === 'SELECT'){
          data[k] = el.options[el.selectedIndex]?.text === '— Seleccionar —' ? '' : (el.value || '');
        } else {
          data[k] = el.value || '';
        }
      }
    });
  };

  sections.forEach(sec=>{
    if(sec.subsections){
      sec.subsections.forEach(sub=> recogerKeys(sub.keys));
    } else if(sec.keys){
      recogerKeys(sec.keys);
    }
  });
  return data;
}

  const m = medicos.find(x=>x.id===(medicoIdOverride||sel.medicoId)) || medicos[0] || {};
  const c = clinicas.find(x=>x.id===(clinicaIdOverride||sel.clinicaId)) || clinicas[0] || {};

  const medNombre = m.nombre || 'Nombre del médico';
  const medCedula = m.cedula || '';
  const medCedulaEsp = m.cedulaEsp || '';

  const medSubesp = m.subespecialidad || '';
  const medDireccion = c.direccion || '';
  const medTelefono = c.telefono || '';
  const medEmail = c.email || '';
  const medExtra = m.extra || '';

  // Construcción legible del bloque de cédulas
  const cedulasStr = [
    medCedula ? `Céd. Prof.: ${medCedula}` : '',
    medCedulaEsp ? `Céd. Esp.: ${medCedulaEsp}` : ''
  ].filter(Boolean).join(' · ');

  // Recoge datos del formulario
  const data = recopilarDatosImpresion(tipo);

  // Para historia clínica: inyecta la edad calculada desde dob y género si no se capturó
  if(tipo === 'historia'){
    if(data.dob && !data.edad){
      const edad = calcAge(data.dob);
      if(edad !== null && edad !== undefined && !isNaN(edad)) data.edad = edad + ' años';
    }
    if(!data.genero && pt?.sex) data.genero = pt.sex;
  }

  // Para nota de evolución: inyecta los datos de Ficha de identificación
  // tomados del registro del paciente + de la historia clínica más reciente (si existe)
  if(tipo === 'evolucion' && pt){
    // Datos directos del paciente
    data.nombre = pt.name || '';
    data.dob = pt.dob || '';
    data.edad = pt.dob ? (calcAge(pt.dob) + ' años') : '';
    data.genero = pt.sex || '';

    // Migración: si la nota tiene tas/tad pero no ta, los uno
    if((data.tas || data.tad) && !data.ta){
      const tas = (data.tas || '').toString().trim();
      const tad = (data.tad || '').toString().trim();
      if(tas && tad) data.ta = tas + '/' + tad;
      else if(tas) data.ta = tas;
      else if(tad) data.ta = tad;
    }

    // Resto desde la historia clínica más reciente del paciente
    const historiaPrev = db.documents
      .filter(d => d.type === 'historia' && d.patientId === pt.id)
      .sort((a,b) => (b.date||'').localeCompare(a.date||''))[0];
    if(historiaPrev?.data){
      const hd = historiaPrev.data;
      // Solo asigno si no vienen ya, para no pisar
      ['ecivil','escol','ocup','religion','dom','grupo-sang','tipif','alergias'].forEach(k => {
        if(hd[k] && !data[k]) data[k] = hd[k];

  }

  // Construye el HTML de impresión
  const fechaImpresion = new Date().toLocaleString('es-MX', {year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});

  // Recoge el data URI del logo embebido en la sidebar
  const logoEl = document.querySelector('.logo-img');
  const logoSrc = logoEl?.src || '';

  // Claves cuyo label nunca se muestra (el texto va directo, sin subtítulo de campo)
  const LABELS_OCULTOS = new Set(['evol','motivo','subj','ef','addendum','pa','analisis','plan','resumen','labs']);

  // Renderiza un conjunto de campos (filas) dado un título de contexto para decidir omitir labels
  function renderFilas(keys, contextTitle){
    const valoresEfectivos = {};
    keys.forEach(k => {
      const raw = (data[k]||'').toString().trim();
      if(raw){
        valoresEfectivos[k] = raw;
      } else if(NEGACIONES_POR_DEFECTO[k]){
        valoresEfectivos[k] = NEGACIONES_POR_DEFECTO[k];

    const camposLlenos = Object.keys(valoresEfectivos);
    if(!camposLlenos.length) return '';

    return camposLlenos.map(k=>{
      let valor = valoresEfectivos[k];
      const label = PRINT_LABELS[k] || k;
      const esLargo = valor.length > 80 || valor.includes('\n');

      const unidad = UNIDADES_CAMPOS[k] || '';
      if(unidad && valor && !valor.toLowerCase().includes(unidad.toLowerCase().replace(/[°/²]/g,''))) {
        valor = valor + ' ' + unidad;

function generarPDFConNumeracion(titulo, paciente){
  if(typeof html2pdf === 'undefined'){
    alert('La librería de PDF aún se está cargando. Espera 2-3 segundos e intenta de nuevo.');
    return;
  }

  // Ocultar la barra superior durante la generación
  const toolbar = document.querySelector('.toolbar-print');
  if(toolbar) toolbar.style.display = 'none';

  // Mostrar mensaje de generación
  const loader = document.createElement('div');
  loader.id = 'pdf-loader';
  loader.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(74,41,97,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;font-size:16px;';
  loader.innerHTML = '<div style="text-align:center;"><div style="font-size:22pt;margin-bottom:12px;">📄 Generando PDF...</div><div style="font-size:14px;opacity:0.9;">Esto puede tardar entre 5 y 20 segundos según el tamaño del documento</div></div>';
  document.body.appendChild(loader);

  const elemento = document.querySelector('.print-container');
  const nombreLimpio = (paciente||'paciente').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,40);
  const tituloLimpio = (titulo||'documento').replace(/[^a-zA-Z0-9_-]/g,'_');
  const fecha = new Date().toISOString().slice(0,10);
  const nombreArchivo = 'RG_' + tituloLimpio + '_' + nombreLimpio + '_' + fecha + '.pdf';

  const opt = {
    margin:       [10, 10, 15, 10], // top, left, bottom, right (mm)
    filename:     nombreArchivo,
    image:        { type: 'jpeg', quality: 0.95 },
    html2canvas:  { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' },
    jsPDF:        { unit: 'mm', format: 'letter', orientation: 'portrait', compress: true },
    pagebreak:    { mode: ['css', 'legacy'], avoid: ['.seccion','.firma-bloque','.leyendas-legales','.patient-bar','.doc-title-banner'] }
  };

  html2pdf().set(opt).from(elemento).toPdf().get('pdf').then(function(pdf){
    // Agregar numeración a cada página
    const totalPages = pdf.internal.getNumberOfPages();
    for(let i = 1; i <= totalPages; i++){
      pdf.setPage(i);
      pdf.setFontSize(9);
      pdf.setTextColor(157, 111, 184); // var(--rg-purple-soft) aproximado
      pdf.setFont('helvetica','normal');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const texto = 'Página ' + i + ' de ' + totalPages;
      const textWidth = pdf.getTextWidth(texto);
      pdf.text(texto, (pageWidth - textWidth) / 2, pageHeight - 8);
    }
  }).save().then(function(){
    document.getElementById('pdf-loader')?.remove();
    if(toolbar) toolbar.style.display = '';
  }).catch(function(err){
    console.error(err);
    alert('Error al generar PDF: ' + (err.message || err));
    document.getElementById('pdf-loader')?.remove();
    if(toolbar) toolbar.style.display = '';
  });
}

// Genera automáticamente un número de expediente con formato HEM-AAAA-NNN
function generarExpedienteAuto(){
  const year = new Date().getFullYear();
  const prefijo = `HEM-${year}-`;
  let max = 0;
  db.patients.forEach(p=>{
    const m = (p.expediente||'').match(new RegExp('^'+prefijo+'(\\d+)$'));
    if(m){
      const n = parseInt(m[1],10);
      if(n>max) max = n;
    }
  });
  const next = String(max+1).padStart(3,'0');
  document.getElementById('np-expediente').value = prefijo+next;
}

      nss: gv('np-id'),
      tel: gv('np-tel'),
      email: gv('np-email'),
      dx: gv('np-dx'),
      created: new Date().toISOString().slice(0,10)
    };
    db.patients.push(p);
    saveDB();
    closeModal();
    currentPatient = p;
    toast('Paciente registrado correctamente'+(expediente?` · Expediente ${expediente}`:''));
    showView('patients');
  }
}

// ============= NOTAS GUARDADAS =============
// Vista que muestra todos los documentos archivados, agrupados por paciente
// y filtrables por tipo. Permite ver, imprimir y eliminar cada uno.

const TIPO_DOC_LABELS = {
  historia: {label:'Historia clínica', icon:'📋', color:'#4A2961'},
  evolucion: {label:'Nota de evolución', icon:'📝', color:'#5E3478'},
  resumen: {label:'Resumen clínico', icon:'📄', color:'#7A4D9C'},
  referencia: {label:'Hoja de referencia', icon:'📨', color:'#993556'},
  receta: {label:'Receta médica', icon:'💊', color:'#B85070'},
  morfologia: {label:'Morfología', icon:'🔬', color:'#D8678A'},
};

let notasFilterPaciente = 'all';
let notasFilterTipo = 'all';

function renderNotasView(){
  const totalDocs = db.documents.length;
  if(!totalDocs){
    setContent(`
      <div class="empty-state">
        <div class="empty-icon">📚</div>
        <p style="font-size:14px;">No hay documentos guardados todavía</p>
        <p style="font-size:12px;color:var(--rg-purple-soft);margin-top:6px;">Cuando guardes documentos clínicos, aparecerán aquí organizados por paciente.</p>
      </div>
    `);
    return;
  }

  // Construir opciones de pacientes (solo los que tienen documentos)
  const pacientesConDocs = [...new Set(db.documents.map(d=>d.patientId))].filter(Boolean);
  const pacientesList = pacientesConDocs.map(pid=>{
    const p = db.patients.find(x=>x.id===pid);
    return p ? p : {id:pid, name:'Paciente eliminado'};
  }).sort((a,b)=>a.name.localeCompare(b.name));

  // Si hay un paciente actualmente seleccionado, filtrar por él
  if(notasFilterPaciente === 'all' && currentPatient){
    notasFilterPaciente = currentPatient.id;
  }

  // Recuperar modo de vista preferido (lista o columnas)
  const modoVista = localStorage.getItem('rg_notas_modo') || 'lista';

  setContent(`
    <div class="card">
      <div class="card-title">Filtros</div>
      <div class="g2">
        <div class="fg"><label>Paciente</label>
          <select id="notas-filter-paciente" onchange="notasAplicarFiltros()">
            <option value="all" ${notasFilterPaciente==='all'?'selected':''}>Todos los pacientes (${pacientesList.length})</option>
            ${pacientesList.map(p=>`<option value="${p.id}" ${notasFilterPaciente===p.id?'selected':''}>${escapeHtml(p.name)}${p.expediente?' · '+escapeHtml(p.expediente):''}</option>`).join('')}
          </select>
        </div>
        <div class="fg"><label>Tipo de documento</label>
          <select id="notas-filter-tipo" onchange="notasAplicarFiltros()">
            <option value="all" ${notasFilterTipo==='all'?'selected':''}>Todos los tipos</option>
            ${Object.entries(TIPO_DOC_LABELS).map(([k,v])=>`<option value="${k}" ${notasFilterTipo===k?'selected':''}>${v.icon} ${v.label}</option>`).join('')}
          </select>
        </div>
      </div>

        <span style="font-size:12px;color:var(--rg-purple-mid);font-weight:500;">Vista:</span>
        <button class="btn btn-sm" id="modo-lista-btn" onclick="cambiarModoNotas('lista')" style="${modoVista==='lista'?'background:var(--rg-purple);color:#fff;':''}">📋 Lista cronológica</button>
        <button class="btn btn-sm" id="modo-columnas-btn" onclick="cambiarModoNotas('columnas')" style="${modoVista==='columnas'?'background:var(--rg-purple);color:#fff;':''}">📊 Columnas por tipo</button>
        <span style="font-size:11px;color:var(--rg-purple-soft);font-style:italic;margin-left:auto;">El modo columnas requiere seleccionar un paciente</span>
      </div>
    </div>

    <div id="notas-resultados"></div>
  `);

  notasAplicarFiltros();
}

function cambiarModoNotas(modo){
  localStorage.setItem('rg_notas_modo', modo);
  // Actualizar estilos de los botones
  const btnLista = document.getElementById('modo-lista-btn');
  const btnCol = document.getElementById('modo-columnas-btn');
  if(btnLista) btnLista.style.cssText = modo==='lista'?'background:var(--rg-purple);color:#fff;':'';
  if(btnCol) btnCol.style.cssText = modo==='columnas'?'background:var(--rg-purple);color:#fff;':'';
  notasAplicarFiltros();
}

function notasAplicarFiltros(){
  const filtroPaciente = document.getElementById('notas-filter-paciente')?.value || 'all';
  const filtroTipo = document.getElementById('notas-filter-tipo')?.value || 'all';
  notasFilterPaciente = filtroPaciente;
  notasFilterTipo = filtroTipo;

  let docs = [...db.documents];
  if(filtroPaciente !== 'all') docs = docs.filter(d=>d.patientId===filtroPaciente);
  if(filtroTipo !== 'all') docs = docs.filter(d=>d.type===filtroTipo);
  // Ordenar por fecha descendente (más recientes primero)
  docs.sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.id||'').localeCompare(a.id||''));

  const el = document.getElementById('notas-resultados');
  if(!el) return;

  if(!docs.length){
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><p>No se encontraron documentos con los filtros aplicados</p></div>`;
    return;
  }

  // Agrupar por paciente si está en "todos"
  if(filtroPaciente === 'all'){
    const grupos = {};
    docs.forEach(d=>{
      const key = d.patientId || 'sin-paciente';
      if(!grupos[key]) grupos[key] = {patientName: d.patientName||'Sin paciente', docs: []};
      grupos[key].docs.push(d);
    });

    el.innerHTML = `
      <div style="margin-bottom:12px;font-size:12px;color:var(--rg-purple-soft);">
        ${docs.length} documento${docs.length!==1?'s':''} en ${Object.keys(grupos).length} paciente${Object.keys(grupos).length!==1?'s':''}
      </div>
    ` + Object.entries(grupos).map(([pid, g])=>{
      const p = db.patients.find(x=>x.id===pid);
      const expBadge = p?.expediente ? `<span style="font-family:Georgia,serif;font-size:10.5px;background:var(--p100);color:var(--rg-purple);padding:2px 8px;border-radius:4px;margin-right:6px;">📁 ${escapeHtml(p.expediente)}</span>` : '';
      return `
        <div class="card" style="margin-bottom:12px;">
          <div class="card-title" style="display:flex;align-items:center;gap:8px;">
            ${expBadge}<span>${escapeHtml(g.patientName)}</span>
            <span style="margin-left:auto;font-size:11px;color:var(--rg-purple-soft);font-weight:normal;">${g.docs.length} documento${g.docs.length!==1?'s':''}</span>
          </div>
          ${g.docs.map(notasRenderDocCard).join('')}
        </div>
      `;
    }).join('');
  } else {
    // Filtrado por un paciente
    const p = db.patients.find(x=>x.id===filtroPaciente);
    const headerInfo = p ? `${escapeHtml(p.name)}${p.expediente?' · 📁 '+escapeHtml(p.expediente):''}${p.dx?' · '+escapeHtml(p.dx):''}` : 'Paciente no encontrado';
    const modoVista = localStorage.getItem('rg_notas_modo') || 'lista';

    if(modoVista === 'columnas' && filtroTipo === 'all'){
      // Vista por columnas: una columna por cada tipo de documento
      const tiposOrden = ['historia','evolucion','resumen','referencia','receta','morfologia'];
      const docsPorTipo = {};
      tiposOrden.forEach(t => docsPorTipo[t] = []);
      docs.forEach(d => {
        if(docsPorTipo[d.type]) docsPorTipo[d.type].push(d);
      });

      const columnasHtml = tiposOrden.map(tipo => {
        const meta = TIPO_DOC_LABELS[tipo];
        const docsCol = docsPorTipo[tipo];
        const cardsHtml = docsCol.length
          ? docsCol.map(d=>notasRenderDocCardCompacto(d)).join('')
          : '<div style="font-size:11.5px;color:var(--rg-purple-soft);font-style:italic;text-align:center;padding:20px 8px;">Sin documentos</div>';
        return `
          <div style="flex:1;min-width:200px;max-width:280px;background:#fff;border-radius:8px;border-top:3px solid ${meta.color};overflow:hidden;display:flex;flex-direction:column;">
            <div style="padding:10px 12px;background:linear-gradient(135deg,${meta.color}11,${meta.color}05);border-bottom:1px solid var(--p100);">
              <div style="font-size:13px;font-weight:600;color:${meta.color};display:flex;align-items:center;gap:6px;">
                <span style="font-size:16px;">${meta.icon}</span> ${meta.label}
              </div>
              <div style="font-size:11px;color:var(--rg-purple-soft);margin-top:2px;">${docsCol.length} documento${docsCol.length!==1?'s':''}</div>
            </div>
            <div style="padding:8px;flex:1;max-height:600px;overflow-y:auto;">
              ${cardsHtml}
            </div>
          </div>
        `;
      }).join('');

      el.innerHTML = `
        <div style="background:linear-gradient(135deg,var(--p50) 0%,var(--pk50) 100%);border-radius:8px;padding:12px 16px;margin-bottom:14px;">
          <div style="font-weight:500;color:var(--rg-purple);">${headerInfo}</div>
          <div style="font-size:12px;color:var(--rg-purple-soft);margin-top:3px;">${docs.length} documento${docs.length!==1?'s':''} organizados por tipo</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;">
          ${columnasHtml}
        </div>
      `;
    } else {
      // Modo lista cronológica (default)
      el.innerHTML = `
        <div style="background:linear-gradient(135deg,var(--p50) 0%,var(--pk50) 100%);border-radius:8px;padding:12px 16px;margin-bottom:14px;">
          <div style="font-weight:500;color:var(--rg-purple);">${headerInfo}</div>
          <div style="font-size:12px;color:var(--rg-purple-soft);margin-top:3px;">${docs.length} documento${docs.length!==1?'s':''}</div>
        </div>
        ${docs.map(notasRenderDocCard).join('')}
      `;
    }
  }
}

// Tarjeta compacta para vista de columnas (más pequeña)

    <div style="background:var(--p50);border-radius:6px;padding:8px 10px;margin-bottom:6px;border-left:3px solid ${meta.color};">
      <div style="font-size:12.5px;font-weight:500;color:var(--rg-purple);line-height:1.3;">${nombre}</div>
      <div style="font-size:10.5px;color:var(--rg-purple-soft);margin-top:2px;">${fecha}</div>
      <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;">
        <button class="btn btn-sm" style="padding:3px 7px;font-size:10.5px;" onclick="abrirDocumentoGuardado('${doc.id}')" title="Abrir">↗</button>
        <button class="btn btn-sm" style="padding:3px 7px;font-size:10.5px;" onclick="renombrarDocumentoGuardado('${doc.id}')" title="Renombrar">✏</button>
        <button class="btn btn-sm" style="padding:3px 7px;font-size:10.5px;" onclick="imprimirDocumentoGuardado('${doc.id}')" title="Imprimir">🖨</button>
        <button class="btn btn-sm" style="padding:3px 7px;font-size:10.5px;color:var(--r600);" onclick="eliminarDocumentoGuardado('${doc.id}')" title="Eliminar">🗑</button>
      </div>
    </div>
  `;
}

function notasRenderDocCard(doc){
  const meta = TIPO_DOC_LABELS[doc.type] || {label:doc.type, icon:'📄', color:'#7A4D9C'};
  const fecha = doc.date || 'sin fecha';
  const updated = doc.updated ? `<span style="font-size:10.5px;color:var(--a800);font-style:italic;">· actualizado ${new Date(doc.updated).toLocaleDateString('es-MX')}</span>` : '';

  // Snippet del contenido (primeros campos relevantes con texto)
  let snippet = '';
  if(doc.data){
    const camposPrioridad = {
      historia: ['motivo','dx','pa'],
      evolucion: ['subj','impresion','pf'],
      resumen: ['dx','est'],
      referencia: ['motivo','resumen'],
      receta: ['dx','meds'],
      morfologia: ['archivos_fsp','archivos_mo']
    };
    const campos = camposPrioridad[doc.type] || Object.keys(doc.data);
    for(const k of campos){
      const v = (doc.data[k]||'').toString().trim();
      if(v){ snippet = v.slice(0,150) + (v.length>150?'…':''); break; }
    }
  }

  // Si el documento tiene título personalizado, va destacado y debajo el tipo+fecha
  // Si no tiene título, mostramos solo tipo+fecha como antes
  const tituloHtml = doc.titulo
    ? `<div class="doc-name">${escapeHtml(doc.titulo)}</div>
       <div style="font-size:11.5px;color:var(--rg-purple-soft);margin-top:1px;">${meta.label} · ${fecha} ${updated}</div>`
    : `<div class="doc-name">${meta.label} <span style="font-size:11px;color:var(--rg-purple-soft);font-weight:normal;">· ${fecha}</span> ${updated}</div>`;

  return `
    <div class="doc-card" style="border-left:3px solid ${meta.color};">
      <div class="doc-icon-sm" style="font-size:20px;">${meta.icon}</div>
      <div class="doc-info">
        ${tituloHtml}
        ${snippet?`<div class="doc-prev-sm">${escapeHtml(snippet)}</div>`:'<div class="doc-prev-sm" style="font-style:italic;color:var(--rg-purple-soft);">Sin contenido visible</div>'}
        <div class="doc-actions-sm">
          <button class="btn btn-sm" onclick="abrirDocumentoGuardado('${doc.id}')">↗ Abrir</button>
          <button class="btn btn-sm" onclick="renombrarDocumentoGuardado('${doc.id}')" title="Renombrar documento">✏ Renombrar</button>
          <button class="btn btn-sm" onclick="imprimirDocumentoGuardado('${doc.id}')">🖨 Imprimir</button>
          <button class="btn btn-sm" style="color:var(--r600);" onclick="eliminarDocumentoGuardado('${doc.id}')">Eliminar</button>
        </div>
      </div>
    </div>
  `;
}

// Renombrar documento guardado sin abrirlo
function renombrarDocumentoGuardado(docId){
  const doc = db.documents.find(d=>d.id===docId);
  if(!doc){ toast('Documento no encontrado'); return; }
  const meta = TIPO_DOC_LABELS[doc.type] || {label:doc.type};
  const nombreActual = doc.titulo || '';
  const nuevoNombre = prompt(`Renombrar ${meta.label}\n\nEscribe un título para este documento (o deja vacío para usar el título genérico tipo+fecha):`, nombreActual);
  if(nuevoNombre === null) return; // Canceló
  const limpio = nuevoNombre.trim();
  doc.titulo = limpio || null;
  doc.updated = new Date().toISOString();
  saveDB();
  toast(limpio ? `✓ Renombrado: ${limpio}` : '✓ Título personalizado quitado');
  notasAplicarFiltros();
}

// Carga el documento guardado en el módulo correspondiente para verlo/editarlo
function abrirDocumentoGuardado(docId){
  const doc = db.documents.find(d=>d.id===docId);
  if(!doc){ toast('Documento no encontrado'); return; }
  // Seleccionar paciente si aplica
  if(doc.patientId){
    const p = db.patients.find(x=>x.id===doc.patientId);
    if(p) currentPatient = p;
  }
  // Navegar al módulo correcto
  showView(doc.type);
  // Después de renderizar, llenar campos con los datos guardados
  setTimeout(()=>cargarDocumentoEnFormulario(doc), 200);
}

// Llena los campos del formulario con los datos del documento
function cargarDocumentoEnFormulario(doc){
  if(!doc?.data) return;
  const prefixes = {historia:'hc-', evolucion:'ev-', resumen:'res-', referencia:'ref-', receta:'rx-', morfologia:''};
  const prefix = prefixes[doc.type];
  if(prefix === undefined){ toast('Tipo de documento no editable inline'); return; }

  // Migración silenciosa para notas de evolución viejas: tas/tad → ta unificado
  if(doc.type === 'evolucion' && (doc.data.tas || doc.data.tad) && !doc.data.ta){
    const tas = (doc.data.tas || '').toString().trim();
    const tad = (doc.data.tad || '').toString().trim();
    if(tas && tad) doc.data.ta = tas + '/' + tad;
    else if(tas) doc.data.ta = tas;
    else if(tad) doc.data.ta = tad;
  }

  Object.entries(doc.data).forEach(([k,v])=>{
    if(v === null || v === undefined) return;
    const el = document.getElementById(prefix+k);
    if(el){
      if(el.tagName === 'SELECT'){
        // Buscar opción que coincida
        const valStr = String(v).trim();
        for(const opt of el.options){
          if(opt.value === valStr || opt.textContent.trim() === valStr){
            el.value = opt.value;
            break;
          }
        }
      } else {
        el.value = String(v);
      }
    }
  });

  // Cargar fecha si existe
  const fechaIds = {historia:'hc-fecha', evolucion:'ev-fecha', resumen:'res-fecha', referencia:'ref-fecha', receta:'rx-fecha', morfologia:'morf-fecha'};
  const fechaEl = document.getElementById(fechaIds[doc.type]);
  if(fechaEl && doc.date) fechaEl.value = doc.date;

  // Cargar título personalizado si existe
  const tituloPrefixes = {historia:'hc-', evolucion:'ev-', resumen:'res-', referencia:'ref-', receta:'rx-', morfologia:'morf-'};
  const tituloEl = document.getElementById(tituloPrefixes[doc.type] + 'titulo');
  if(tituloEl) tituloEl.value = doc.titulo || '';

  // Disparar cálculo de IMC si aplica
  if(doc.type==='historia') { try{ calcIMC('hc'); }catch(e){} }
  else if(doc.type==='evolucion') { try{ calcIMC('ev'); evalSV(); }catch(e){} }

  toast(`✓ Cargado: ${TIPO_DOC_LABELS[doc.type]?.label||doc.type} del ${doc.date||'sin fecha'}`);
}

// Imprime un documento guardado: lo carga y luego abre el imprimible
function imprimirDocumentoGuardado(docId){
  const doc = db.documents.find(d=>d.id===docId);
  if(!doc){ toast('Documento no encontrado'); return; }
  if(doc.type === 'morfologia'){
    toast('Morfología no soporta impresión directa — abre el documento para gestionar archivos');
    return;
  }
  // Cargar y luego imprimir
  abrirDocumentoGuardado(docId);
  setTimeout(()=>{
    if(typeof imprimirDocumento === 'function'){
      imprimirDocumento(doc.type);
    }
  }, 500);
}

// Elimina un documento guardado (con confirmación)
function eliminarDocumentoGuardado(docId){
  const doc = db.documents.find(d=>d.id===docId);
  if(!doc) return;
  const meta = TIPO_DOC_LABELS[doc.type] || {label:doc.type};
  if(!confirm(`¿Eliminar este documento?\n\n${meta.label} de ${doc.patientName||'Sin paciente'}\nFecha: ${doc.date||'sin fecha'}\n\nEsta acción no se puede deshacer.`)) return;
  db.documents = db.documents.filter(d=>d.id!==docId);

  toast(`${meta.label} eliminada`);
  notasAplicarFiltros();
}

// Eliminar paciente: borra el paciente, sus documentos, sus consentimientos
// y los archivos binarios asociados en IndexedDB. Pide doble confirmación.
async function eliminarPaciente(id){
  const p = db.patients.find(x=>x.id===id);
  if(!p) return;

  const docs = db.documents.filter(d=>d.patientId===id);
  const cons = (db.consentimientos||[]).filter(c=>c.patientId===id);

  // Resumen para que vea qué se va a eliminar
  let resumen = `¿Eliminar al paciente "${p.name}"?\n\n`;
  resumen += `Se eliminará:\n`;
  resumen += `• Datos del paciente\n`;
  if(docs.length) resumen += `• ${docs.length} documento${docs.length!==1?'s':''} clínico${docs.length!==1?'s':''} (historia, evolución, etc.)\n`;
  if(cons.length) resumen += `• ${cons.length} consentimiento${cons.length!==1?'s':''}\n`;
  resumen += `• Todos los archivos adjuntos (PDF, JPG, PNG)\n\n`;
  resumen += `Esta acción NO se puede deshacer.`;

  if(!confirm(resumen)) return;

  // Segunda confirmación escribiendo el nombre — solo si hay documentos asociados
  if(docs.length || cons.length){
    const tipoConfirma = prompt(`Para confirmar la eliminación, escribe el nombre del paciente exactamente:\n\n${p.name}`);
    if(!tipoConfirma || tipoConfirma.trim() !== p.name){
      toast('Eliminación cancelada — el nombre no coincide');
      return;
    }
  }

  // Borrar archivos binarios en IndexedDB
  try{
    const allFiles = await idbListFiles({patientId: id});
    for(const f of allFiles){
      try{ await idbDeleteFile(f.id); }catch(e){console.error(e);}
    }
  }catch(e){ console.error('Error eliminando archivos IDB:', e); }

  // Borrar consentimientos (y sus archivos en IDB ya estaban incluidos arriba)
  db.consentimientos = (db.consentimientos||[]).filter(c=>c.patientId!==id);

  // Borrar documentos clínicos
  db.documents = db.documents.filter(d=>d.patientId!==id);

  // Borrar paciente
  db.patients = db.patients.filter(x=>x.id!==id);

  saveDB();

  // Si era el paciente seleccionado actualmente, deseleccionar
  if(currentPatient?.id === id){
    currentPatient = null;
  }

  // Refrescar vista
  if(currentView === 'patients'){
    renderPatients();
  } else if(currentView === 'dashboard'){
    renderDashboard();
  }

  toast(`Paciente "${p.name}" eliminado completamente`);
}

function filterPatients(q){
  q = q.toLowerCase();
  const f = db.patients.filter(p=>
    p.name.toLowerCase().includes(q) ||
    (p.dx||'').toLowerCase().includes(q) ||
    (p.expediente||'').toLowerCase().includes(q) ||
    (p.nss||'').toLowerCase().includes(q)
  );
  renderPatientList(f);
}

function selectPatient(id){
  currentPatient = db.patients.find(p=>p.id===id);
  if(currentView==='patients') renderPatients();
  toast(`Paciente seleccionado: ${currentPatient.name}`);
}

function setH(btn, type, val){
  const map = {tab:['hc-tab-no','hc-tab-ex','hc-tab-si'],alc:['hc-alc-no','hc-alc-ex','hc-alc-si'],sus:['hc-sus-no','hc-sus-ex','hc-sus-si']};
  const cls = {no:'sel-no',ex:'sel-ex',si:'sel-si'};
  map[type].forEach(id=>{const e=document.getElementById(id); if(e) e.className='hb';});
  btn.classList.add(cls[val]);
  showD('hc-'+type+'-det', val!=='no');

function calcIT(){
  const c = parseFloat(gv('hc-tab-cpd'))||0;
  const a = parseFloat(gv('hc-tab-anos'))||0;
  const el = document.getElementById('hc-tab-it');
  if(el) el.value = c&&a ? ((c/20)*a).toFixed(1)+' paq/año' : '';
}

function calcIMC(prefix){
  const p = parseFloat(gv(prefix+'-peso'));
  const t = parseFloat(gv(prefix+'-talla'));
  if(p && t){
    const imcEl = document.getElementById(prefix+'-imc');
    const scEl = document.getElementById(prefix+'-sc');
    if(imcEl) imcEl.value = (p/((t/100)**2)).toFixed(1);
    if(scEl) scEl.value = Math.sqrt((p*t)/3600).toFixed(2)+' m²';
  }
}

let hcPDFs = [];
function hcDropPDF(e){
  e.preventDefault();
  document.getElementById('hc-pdf-zone').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if(f && f.type==='application/pdf') hcHandlePDF(f);
}

async function hcHandlePDF(file){
  if(!file) return;
  const idx = hcPDFs.length;
  hcPDFs.push(null);
  const card = document.createElement('div');
  card.className = 'doc-card';
  card.id = 'hc-pdf-'+idx;
  card.innerHTML = `
    <div class="doc-icon-sm">📄</div>
    <div class="doc-info">
      <div class="doc-name">${file.name}</div>
      <div class="doc-meta-sm" id="hc-pdf-meta-${idx}">Extrayendo...</div>
      <div class="doc-prev-sm" id="hc-pdf-prev-${idx}">Procesando...</div>
      <div class="doc-actions-sm">
        <button class="btn btn-sm btn-ai" onclick="transcribirPDF(hcPDFs[${idx}],'hc-labs','hc-pdf-ai-${idx}')">✦ Transcribir con IA</button>
        <button class="btn btn-sm" onclick="hcAppendLabs(${idx})">Agregar texto crudo</button>
        <button class="btn btn-sm" onclick="document.getElementById('hc-pdf-${idx}').remove();hcPDFs[${idx}]=null;" style="color:var(--r600);">Eliminar</button>
      </div>
      <div id="hc-pdf-ai-${idx}"></div>
    </div>`;
  document.getElementById('hc-pdf-list').appendChild(card);
  try{
    const ab = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:ab}).promise;
    let text = '';
    for(let i=1;i<=pdf.numPages;i++){
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      text += tc.items.map(it=>it.str).join(' ')+'\n';
    }
    hcPDFs[idx] = {name:file.name, text, pages:pdf.numPages};
    document.getElementById('hc-pdf-meta-'+idx).textContent = pdf.numPages+' págs.';
    document.getElementById('hc-pdf-prev-'+idx).textContent = text.slice(0,180).replace(/\s+/g,' ')+'…';
  }catch(e){
    document.getElementById('hc-pdf-prev-'+idx).textContent = 'Error: '+e.message;
  }
}

// ============= TRANSCRIPCIÓN ESTRUCTURADA DE PDFs =============
// Envía el texto extraído del PDF a Claude.ai con un prompt que solicita
// transcripción en el formato estandarizado del Dr. Rentería/Garzón.
function transcribirPDF(pdfData, targetFieldId, targetPanelId){
  if(!pdfData || !pdfData.text){ toast('PDF no procesado aún'); return; }

  const prompt = `Eres asistente clínico de hematología. Recibes el texto extraído de un PDF que contiene resultados de laboratorio o un estudio de gabinete/imagen. Tu tarea es TRANSCRIBIR los datos al formato exacto que se indica abajo, sin agregar interpretación clínica ni recomendaciones.

═══════════════════════════════════════════
INSTRUCCIONES
═══════════════════════════════════════════

1. Identifica si el PDF corresponde a:
   A) ESTUDIOS DE LABORATORIO (citometría hemática, química sanguínea, electrolitos, perfil hepático, hierro, EGO, etc.)
   B) ESTUDIOS DE GABINETE / IMAGEN (radiografía, USG, TAC, RMN, PET-CT, ECG, endoscopia, biopsia, etc.)

2. Si es A — ESTUDIOS DE LABORATORIO: transcribe los valores en el orden EXACTO de la siguiente plantilla, manteniendo nombres y unidades. Si un parámetro no aparece en el PDF, escribe "no reportado". Si hay valores fuera del rango de referencia, márcalos con (↑) o (↓) al final del valor. Conserva los grupos exactos:

Citometría hemática: Hemoglobina ___ g/dL, hematocrito ___ %, eritrocitos ___ x10⁶/mL, VCM ___ fL, HCM ___ pg, CMHC ___ g/dL, ADE DE ___ fL, ADE CV ___ %, leucocitos totales ___ /µL, neutrófilos segmentados ___ /mm³, linfocitos ___ /mm³, monocitos ___ /mm³, eosinófilos ___ /mm³, basófilos ___ /mm³, plaquetas ___ /µL, VPM ___ fL.

Parámetros bioquímicos: glucosa ___ mg/dL, urea ___ mg/dL, BUN ___ mg/dL, creatinina en suero ___ mg/dL, ácido úrico en suero ___ mg/dL, colesterol total ___ mg/dL, triglicéridos ___ mg/dL, colesterol HDL ___ mg/dL, colesterol LDL ___ mg/dL, colesterol VLDL ___ mg/dL, bilirrubina total ___ mg/dL, albúmina ___ g/dL, AST ___ U/L, ALT ___ U/L, fosfatasa alcalina ___ U/L, DHL ___ U/L, globulinas ___ g/dL.

Electrolitos: sodio ___ mmol/L, potasio ___ mmol/L, cloruro ___ mmol/L, calcio en suero ___ mg/dL, fósforo en suero ___ mg/dL, magnesio en suero ___ mg/dL.

Metabolismo del hierro: hierro sérico ___ mg/dL.

Examen general de orina: densidad ___, pH ___, esterasa leucocitaria ___, leucocitos por campo ___, bacterias ___, eritrocitos ___.

Otros estudios de laboratorio (si aparecen en el PDF y no caben en las categorías anteriores): listarlos con su valor y unidad.

3. Si es B — ESTUDIOS DE GABINETE / IMAGEN: transcribe únicamente los HALLAZGOS más relevantes y la CONCLUSIÓN del reporte, en formato estructurado:

Tipo de estudio: ___
Fecha del estudio: ___
Hallazgos relevantes:
- ___
- ___
Conclusión / Impresión diagnóstica: ___

4. Encabeza tu respuesta con el nombre del archivo procesado y la fecha del estudio si está disponible.
5. Al final, copia limpio en un bloque de código markdown (entre triples comillas invertidas) la transcripción completa lista para que el médico la pegue directamente en el campo de estudios de su expediente electrónico.
6. NO incluyas análisis, interpretación clínica, sugerencias diagnósticas ni recomendaciones — solo transcripción fiel al formato.

═══════════════════════════════════════════
ARCHIVO: ${pdfData.name}
═══════════════════════════════════════════
${pdfData.text.slice(0,8000)}`;

  abrirEnClaude(prompt, targetPanelId, `Transcripción enviada — ${pdfData.name}`);
}

// Guarda PDFs/imágenes en IndexedDB vinculados al paciente actual
// Aparecen en cada apertura del módulo (renderAdjuntos) y en Documentos guardados
async function adjuntarArchivos(files, modulo, listId){
  if(!currentPatient){ toast('Selecciona un paciente'); return; }
  if(!files || !files.length) return;
  for(const file of files){
    if(file.size > 30 * 1024 * 1024){ toast(`${file.name} es > 30MB, omitido`); continue; }
    try{
      await idbSaveFile(file, {patientId: currentPatient.id, module: modulo, originalName: file.name});
      toast(`✓ Adjunto guardado: ${file.name}`);
    }catch(e){
      toast(`Error guardando ${file.name}: ${e.message}`);
    }
  }
  renderAdjuntos(modulo, listId);
}

async function renderAdjuntos(modulo, listId){
  const el = document.getElementById(listId);
  if(!el || !currentPatient) return;
  try{
    const archivos = await idbListFiles({patientId: currentPatient.id, module: modulo});
    if(!archivos.length){
      el.innerHTML = '<div style="font-size:12px;color:var(--rg-purple-soft);font-style:italic;padding:8px;">Sin adjuntos guardados todavía</div>';
      return;
    }
    el.innerHTML = archivos.map(a=>{
      const tipo = a.type.includes('pdf') ? '📄' : '🖼';
      const sizeKB = (a.size/1024).toFixed(0);
      return `
        <div class="doc-card" style="border-left:3px solid var(--rg-purple);">
          <div class="doc-icon-sm">${tipo}</div>
          <div class="doc-info">
            <div class="doc-name">${escapeHtml(a.name)}</div>
            <div class="doc-meta-sm">${sizeKB} KB · ${new Date(a.created).toLocaleString('es-MX')}</div>
            <div class="doc-actions-sm">
              <button class="btn btn-sm" onclick="abrirAdjunto('${a.id}')">↗ Abrir</button>
              <button class="btn btn-sm" style="color:var(--r600);" onclick="eliminarAdjunto('${a.id}','${modulo}','${listId}')">Eliminar</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }catch(e){
    el.innerHTML = '<div style="color:var(--r600);font-size:12px;">Error cargando adjuntos: '+e.message+'</div>';
  }
}

async function abrirAdjunto(fileId){
  try{
    const url = await idbObjectURL(fileId);
    window.open(url, '_blank');
  }catch(e){
    toast('No se pudo abrir el adjunto: '+e.message);

async function eliminarAdjunto(fileId, modulo, listId){
  if(!confirm('¿Eliminar este adjunto?')) return;
  try{
    await idbDeleteFile(fileId);
    toast('Adjunto eliminado');
    renderAdjuntos(modulo, listId);
  }catch(e){
    toast('Error eliminando: '+e.message);
  }
}

// ============= HELPER PARA GUARDADO INTELIGENTE =============
// Si ya existe un documento del mismo tipo para el paciente actual, pregunta
// si crear uno nuevo o actualizar el existente. Si no existe, simplemente lo crea.
// Mapa de prefijos por tipo para localizar el campo de título
const TITULO_PREFIX = {historia:'hc-', evolucion:'ev-', resumen:'res-', referencia:'ref-', receta:'rx-', morfologia:'morf-'};

function guardarDocumentoSmart(tipo, tipoLabel, fecha, data, archivosExtra){
  if(!currentPatient){ alert('Selecciona un paciente'); return false; }

  // Capturar el título personalizado del campo correspondiente
  const prefix = TITULO_PREFIX[tipo] || '';
  const tituloPersonalizado = (gv(prefix + 'titulo') || '').trim();

  // Buscar documentos previos del mismo tipo para este paciente
  const previos = db.documents
    .filter(d=>d.type===tipo && d.patientId===currentPatient.id)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  if(previos.length > 0){
    // Abrir modal de selección entre múltiples opciones
    abrirModalGuardadoSmart(tipo, tipoLabel, fecha, data, archivosExtra, previos, tituloPersonalizado);
    return true;
  }

  // No hay previos: crear documento nuevo directamente
  const doc = {
    id: 'D'+Date.now(),
    type: tipo,
    patientId: currentPatient.id,
    patientName: currentPatient.name,
    date: fecha,
    titulo: tituloPersonalizado || null,
    data
  };
  if(archivosExtra) Object.assign(doc, archivosExtra);
  db.documents.push(doc);
  saveDB();
  toast(`${tipoLabel} guardada${tituloPersonalizado?' · '+tituloPersonalizado:''}`);
  return true;
}

// Modal que pregunta si crear nuevo o actualizar uno específico de los existentes
function abrirModalGuardadoSmart(tipo, tipoLabel, fecha, data, archivosExtra, previos, tituloPersonalizado){
  // Quitar modal previo si existe
  const existente = document.getElementById('smart-save-modal');
  if(existente) existente.remove();

  // Construir lista de opciones (documentos existentes + opción "crear nuevo")
  const opcionesHtml = previos.map((doc, idx)=>{
    const nombre = doc.titulo || `${tipoLabel.charAt(0).toUpperCase()+tipoLabel.slice(1)} sin título`;
    const fechaTxt = doc.date || 'sin fecha';

  // Guardar payload temporalmente para que confirmarGuardadoSmart lo recupere

function confirmarGuardadoSmart(tipo, tipoLabel, fecha){
  const radio = document.querySelector('input[name="smart-save-target"]:checked');
  if(!radio){ alert('Selecciona una opción'); return; }
  const target = radio.value;
  const payload = window._smartSavePayload || {};
  const data = payload.data;
  const archivosExtra = payload.archivosExtra;
  const tituloPersonalizado = payload.tituloPersonalizado || '';

  document.getElementById('smart-save-modal').remove();

  if(target === '__new__'){
    // Crear nuevo
    const doc = {
      id: 'D'+Date.now(),
      type: tipo,
      patientId: currentPatient.id,
      patientName: currentPatient.name,
      date: fecha,
      titulo: tituloPersonalizado || null,
      data
    };
    if(archivosExtra) Object.assign(doc, archivosExtra);
    db.documents.push(doc);
    saveDB();
    toast(`✓ Nuevo ${tipoLabel} guardado${tituloPersonalizado?' · '+tituloPersonalizado:''}`);
  } else {
    // Actualizar el documento seleccionado
    const doc = db.documents.find(d=>d.id===target);
    if(!doc){ toast('Documento no encontrado'); return; }
    const fechaAnterior = doc.date || 'sin fecha';
    doc.date = fecha;
    doc.data = data;
    // Si capturó un nuevo título, lo actualiza; si no, conserva el existente
    if(tituloPersonalizado) doc.titulo = tituloPersonalizado;
    if(archivosExtra) Object.assign(doc, archivosExtra);
    doc.updated = new Date().toISOString();
    saveDB();
    const nombreDoc = doc.titulo || tipoLabel;
    toast(`✓ "${nombreDoc}" actualizado (${fechaAnterior} → ${fecha})`);
  }

  delete window._smartSavePayload;
}

// Abre Claude.ai en una nueva pestaña con el prompt pre-cargado en la URL.
// También copia el prompt al portapapeles como respaldo.
function abrirEnClaude(prompt, targetElId, titulo){
  const el = targetElId ? document.getElementById(targetElId) : null;

  // Copiar al portapapeles
  navigator.clipboard.writeText(prompt).catch(()=>{});

  // Construir URL de Claude.ai con el prompt
  // Limita a 7000 chars para no exceder el tamaño máximo de URL
  const truncated = prompt.length > 7000 ? prompt.slice(0,7000)+'\n\n[...prompt truncado, copiado completo al portapapeles]' : prompt;
  const claudeUrl = 'https://claude.ai/new?q=' + encodeURIComponent(truncated);

  // Abrir en nueva pestaña
  const win = window.open(claudeUrl, '_blank');

  // Mostrar panel de confirmación
  if(el){
    el.innerHTML = `
      <div class="ai-panel">
        <div class="ai-hdr">
          <div class="ai-dot"></div>
          <span class="ai-ttl">${titulo || 'Análisis enviado a Claude.ai'}</span>
        </div>
        <div class="ai-body">

          <p style="font-size:12px;color:var(--rg-purple-soft);margin-bottom:10px;">Si el navegador bloqueó la nueva pestaña, autoriza pop-ups o usa el botón de abajo.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <a href="${claudeUrl}" target="_blank" class="btn btn-ai" style="text-decoration:none;display:inline-block;">↗ Abrir Claude.ai</a>
            <button class="btn btn-sm" onclick="navigator.clipboard.writeText(${JSON.stringify(prompt).replace(/"/g,'&quot;').replace(/'/g,'&#39;')});toast('Prompt copiado al portapapeles');">📋 Copiar prompt</button>
          </div>
        </div>
      </div>`;
  }
  toast('Prompt copiado y enviado a Claude.ai');
}

// Variante para prompts largos: copia el prompt al portapapeles SIN truncar,
// abre Claude.ai vacío y guía al usuario a pegar con Ctrl/Cmd+V.
function abrirEnClaudeLargo(prompt, targetElId, titulo){
  const el = targetElId ? document.getElementById(targetElId) : null;

  // Copiar prompt completo al portapapeles (sin truncar)
  let copiado = false;
  navigator.clipboard.writeText(prompt).then(()=>{ copiado = true; }).catch(()=>{});

  if(el){
    const charCount = prompt.length;
    el.innerHTML = `
      <div class="ai-panel" style="border-color:var(--rg-pink);">
        <div class="ai-hdr">
          <div class="ai-dot"></div>
          <span class="ai-ttl">${titulo || 'Prompt copiado al portapapeles'}</span>
        </div>
        <div class="ai-body">
          <p style="margin-bottom:8px;">✓ El prompt completo (<strong>${charCount.toLocaleString('es-MX')} caracteres</strong>) se copió al portapapeles.</p>
          <p style="margin-bottom:10px;">✓ Se abrió Claude.ai en una nueva pestaña.</p>
          <ol style="margin:8px 0 12px 18px;padding:0;font-size:12.5px;">
            <li>Ve a la pestaña de Claude.ai</li>

  }
  toast('Prompt completo copiado — pégalo en Claude.ai con Ctrl+V');
}

  const data = recopilarHistoria();

  if(!content.trim()){ toast('Llena algunos campos antes de analizar'); return; }

  const prompt = `Eres asistente clínico especialista en hematología. Para este análisis, utiliza como referencia los documentos, guías clínicas, libros y artículos que tengo cargados en este proyecto/conversación de Claude.ai (ASH, NCCN, ESMO, OMS 2022, ICC 2022 y cualquier otra bibliografía que haya subido). Cita explícitamente las guías o documentos relevantes cuando apliques sus recomendaciones.

Analiza la siguiente historia clínica y provee tu respuesta en DOS secciones claramente separadas:

═══════════════════════════════════════════
PARTE 1 — ANÁLISIS CLÍNICO
═══════════════════════════════════════════

1. Resumen clínico estructurado
2. Elementos clave para diagnóstico hematológico
3. Factores de riesgo identificados
4. Alertas o datos de alarma
5. Estudios complementarios recomendados (citando la guía específica)
6. Consideraciones terapéuticas iniciales (citando la guía específica)

═══════════════════════════════════════════
PARTE 2 — SUGERENCIAS DE MEJORA EN LA REDACCIÓN
═══════════════════════════════════════════

Revisa la redacción de la historia clínica y sugiere mejoras específicas con base en:
- Claridad y orden cronológico
- Uso correcto de terminología médica y hematológica
- Información incompleta o ambigua que debería precisarse
- Detalles relevantes faltantes según NOM-004-SSA3-2012
- Errores ortográficos o de estilo profesional
- Frases que podrían reformularse para mayor precisión clínica

Cuando sugieras una mejora, indica el campo afectado, cita el texto original entre comillas y propón una versión mejorada.

Responde en español, conciso, con viñetas.

═══════════════════════════════════════════
HISTORIA CLÍNICA:
═══════════════════════════════════════════
${content}`;

  abrirEnClaudeLargo(prompt, 'hc-ai-result', 'Análisis enviado — Historia clínica');
}

function evalSV(){
  // Parsear TA del formato "120/80"
  const taStr = gv('ev-ta').trim();
  let tas = 0, tad = 0;
  const taMatch = taStr.match(/^(\d{2,3})\s*\/\s*(\d{2,3})/);
  if(taMatch){
    tas = parseFloat(taMatch[1]);
    tad = parseFloat(taMatch[2]);
  }
  const fc = parseFloat(gv('ev-fc'));
  const fr = parseFloat(gv('ev-fr'));
  const temp = parseFloat(gv('ev-temp'));
  const spo2 = parseFloat(gv('ev-spo2'));
  const gluc = parseFloat(gv('ev-gluc'));
  const eva = parseFloat(gv('ev-eva'));
  const chips = [];
  if(temp>=38.0) chips.push({t:`Fiebre ${temp}°C`,c:'chip-alert'});
  else if(temp>0&&temp<36) chips.push({t:`Hipotermia ${temp}°C`,c:'chip-warn'});
  if(tas>0&&tad>0){
    if(tas>=180||tad>=110) chips.push({t:`HTA severa ${tas}/${tad}`,c:'chip-alert'});
    else if(tas>=140||tad>=90) chips.push({t:`HTA ${tas}/${tad}`,c:'chip-warn'});
    else if(tas<90) chips.push({t:`Hipotensión ${tas}/${tad}`,c:'chip-alert'});
  }
  if(fc>100) chips.push({t:`Taquicardia ${fc}`,c:'chip-warn'});
  else if(fc>0&&fc<60) chips.push({t:`Bradicardia ${fc}`,c:'chip-warn'});
  if(fr>20) chips.push({t:`Taquipnea ${fr}`,c:'chip-warn'});
  if(spo2>0&&spo2<95) chips.push({t:`SpO₂ baja ${spo2}%`,c:'chip-alert'});
  if(gluc>180) chips.push({t:`Hiperglucemia ${gluc}`,c:'chip-warn'});
  else if(gluc>0&&gluc<70) chips.push({t:`Hipoglucemia ${gluc}`,c:'chip-alert'});
  if(eva>=7) chips.push({t:`Dolor severo EVA ${eva}`,c:'chip-alert'});
  else if(eva>=4) chips.push({t:`Dolor moderado EVA ${eva}`,c:'chip-warn'});
  const el = document.getElementById('ev-sv-alertas');
  if(!el) return;
  if(chips.length) el.innerHTML = chips.map(c=>`<span class="alert-chip ${c.c}">${c.t}</span>`).join('');
  else el.innerHTML = '<span class="alert-chip chip-ok">Signos vitales en rangos normales</span>';
}

let evPDFs = [];
function evDropPDF(e){
  e.preventDefault();
  document.getElementById('ev-pdf-zone').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if(f && f.type==='application/pdf') evHandlePDF(f);
}

async function evHandlePDF(file){
  if(!file) return;
  const idx = evPDFs.length;
  evPDFs.push(null);
  const card = document.createElement('div');
  card.className = 'doc-card';
  card.id = 'ev-pdf-'+idx;
  card.innerHTML = `<div class="doc-icon-sm">📄</div><div class="doc-info"><div class="doc-name">${file.name}</div><div class="doc-meta-sm" id="ev-pdf-meta-${idx}">Extrayendo...</div><div class="doc-prev-sm" id="ev-pdf-prev-${idx}">Procesando...</div><div class="doc-actions-sm"><button class="btn btn-sm btn-ai" onclick="transcribirPDF(evPDFs[${idx}],'ev-labs','ev-pdf-ai-${idx}')">✦ Transcribir con IA</button><button class="btn btn-sm" onclick="evAppendLabs(${idx})">Agregar texto crudo</button><button class="btn btn-sm" onclick="document.getElementById('ev-pdf-${idx}').remove();evPDFs[${idx}]=null;" style="color:var(--r600);">Eliminar</button></div><div id="ev-pdf-ai-${idx}"></div></div>`;
  document.getElementById('ev-pdf-list').appendChild(card);
  try{
    const ab = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:ab}).promise;
    let text = '';
    for(let i=1;i<=pdf.numPages;i++){
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      text += tc.items.map(it=>it.str).join(' ')+'\n';
    }
    evPDFs[idx] = {name:file.name,text,pages:pdf.numPages};
    document.getElementById('ev-pdf-meta-'+idx).textContent = pdf.numPages+' págs.';
    document.getElementById('ev-pdf-prev-'+idx).textContent = text.slice(0,180).replace(/\s+/g,' ')+'…';
  }catch(e){
    document.getElementById('ev-pdf-prev-'+idx).textContent = 'Error: '+e.message;
  }
}

function evAppendLabs(idx){
  const d = evPDFs[idx];
  if(!d) return;
  const el = document.getElementById('ev-labs');
  el.value += (el.value?'\n\n--- '+d.name+' ---\n':'')+d.text.slice(0,3000);
  toast('PDF agregado a laboratorios');
}

function morfDrop(e, type){
  e.preventDefault();

async function morfHandleFiles(files, type){
  for(const f of files){
    const ok = f.type==='application/pdf' || f.type.startsWith('image/');
    if(ok) await morfProcessFile(f, type);
  }
}

// Procesa un archivo: si es PDF, extrae texto. Si es imagen, lo guarda directamente.
// En todos los casos guarda el binario en IndexedDB.
async function morfProcessFile(file, type){
  const idx = morfFiles[type].length;
  morfFiles[type].push(null);
  const isImg = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  const card = document.createElement('div');
  card.className = 'doc-card';
  card.id = `${type}-card-${idx}`;
  const icon = isImg ? '🖼️' : (type==='fsp'?'🔬':'🧬');
  card.innerHTML = `
    <div class="doc-icon-sm">${icon}</div>
    <div class="doc-info">
      <div class="doc-name">${file.name}</div>
      <div class="doc-meta-sm" id="${type}-meta-${idx}">${(file.size/1024).toFixed(0)} KB · ${isImg?'imagen':'PDF'}</div>
      <div id="${type}-preview-${idx}"></div>
      <div class="doc-prev-sm" id="${type}-prev-${idx}" style="display:${isPdf?'block':'none'};">Procesando...</div>
      <div class="doc-actions-sm" id="${type}-actions-${idx}">
        <span style="font-size:11px;color:var(--rg-purple-soft);">⏳ Guardando…</span>
      </div>
    </div>`;
  document.getElementById(type+'-list').appendChild(card);

  // Vista previa de imagen mientras se guarda
  if(isImg){
    const previewEl = document.getElementById(`${type}-preview-${idx}`);
    const localUrl = URL.createObjectURL(file);
    previewEl.innerHTML = `<img src="${localUrl}" style="max-width:240px;max-height:160px;border-radius:6px;border:1px solid var(--p200);margin-top:8px;display:block;" alt="${file.name}">`;
  }

  // Extraer texto si es PDF (para análisis IA posterior)
  let extractedText = '';
  if(isPdf){
    try{
      const ab = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:ab}).promise;
      for(let i=1;i<=pdf.numPages;i++){
        const pg = await pdf.getPage(i);
        const tc = await pg.getTextContent();
        extractedText += tc.items.map(it=>it.str).join(' ')+'\n';
      }
      document.getElementById(`${type}-meta-${idx}`).textContent = `${(file.size/1024).toFixed(0)} KB · ${pdf.numPages} págs.`;
      document.getElementById(`${type}-prev-${idx}`).textContent = extractedText.slice(0,180).replace(/\s+/g,' ')+'…';
    }catch(e){
      document.getElementById(`${type}-prev-${idx}`).textContent = 'Error al leer PDF: '+e.message;
    }
  }

  // Guardar en IndexedDB
  try{
    const fileId = await idbSaveFile(file, {
      patientId: currentPatient.id,
      patientName: currentPatient.name,
      module: 'morf-'+type,
      extractedText: extractedText || ''
    });
    morfFiles[type][idx] = {id:fileId, name:file.name, type:file.type, size:file.size, text:extractedText, isImg, isPdf};

    // Botones según el tipo
    const actionsEl = document.getElementById(`${type}-actions-${idx}`);
    actionsEl.innerHTML = `
      ${isPdf ? `<button class="btn btn-sm btn-ai" onclick="analizarMorfFile(${idx},'${type}')">✦ Analizar con IA</button>` : ''}
      <button class="btn btn-sm" onclick="abrirArchivoGuardado('${fileId}')">↗ Ver</button>
      <button class="btn btn-sm" onclick="document.getElementById('${type}-card-${idx}').remove();idbDeleteFile('${fileId}');morfFiles['${type}'][${idx}]=null;morfUpdateBadges();morfShowStorage();" style="color:var(--r600);">Eliminar</button>
    `;
    morfUpdateBadges();
    morfShowStorage();
    toast(`${file.name} guardado`);
  }catch(err){
    document.getElementById(`${type}-actions-${idx}`).innerHTML = `<span style="color:var(--r600);font-size:11px;">Error al guardar: ${err.message}</span>`;
  }
}
